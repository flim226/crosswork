<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGP-LS Parser</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --cyan: #39d2c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  textarea {
    width: 100%;
    min-height: 180px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.8rem;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .toolbar {
    display: flex;
    gap: 10px;
    margin: 12px 0;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .filter-group {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: auto;
  }
  .filter-group label { color: var(--muted); font-size: 0.8rem; }
  .filter-group input, .filter-group select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 0.8rem;
  }
  .filter-group input:focus, .filter-group select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .stats {
    display: flex;
    gap: 16px;
    margin: 16px 0;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    min-width: 140px;
  }
  .stat-card .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
  .stat-card .value { font-size: 1.4rem; font-weight: 700; }
  .stat-card .value.blue { color: var(--accent); }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.orange { color: var(--orange); }
  .stat-card .value.purple { color: var(--purple); }

  .section-title {
    font-size: 1.1rem;
    margin: 24px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
  }
  .badge-blue { background: #1f3a5f; color: var(--accent); }
  .badge-green { background: #1a3a2a; color: var(--green); }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  th {
    background: var(--surface);
    text-align: left;
    padding: 10px 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: var(--accent); }
  th .sort-arrow { font-size: 0.6rem; margin-left: 4px; }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(88,166,255,0.04); }

  .tag {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .tag-pcep { background: #2d1f3d; color: var(--purple); }
  .tag-bgp { background: #1f3a5f; color: var(--accent); }
  .tag-config { background: #3a2f1a; color: var(--orange); }
  .tag-unknown { background: #2a2a2a; color: var(--muted); }
  .tag-best { background: #1a3a2a; color: var(--green); }
  .tag-ibgp { background: #1f3a5f; color: var(--accent); }
  .tag-valid { background: #2a2a2a; color: var(--muted); }
  .tag-ipv4 { background: #1a3a2a; color: var(--cyan); }
  .tag-ipv6 { background: #2d1f3d; color: var(--purple); }

  .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }

  #output { display: none; }
  #output.visible { display: block; }
</style>
</head>
<body>

<h1>🔍 BGP-LS Parser</h1>
<p class="subtitle">Paste <code>show bgp link-state link-state</code> or <code>show lslib server topology-db</code> output to parse Nodes, Links, Prefixes, and SR Policy NLRIs</p>

<textarea id="input" placeholder="Paste BGP-LS output here...
Example: *> [SP][SR][I0x0][N[c0][b0.0.0.0][te39.39.39.39]][C[po0x3][f0x0][e66.66.66.66][cl0xf7e][as0][oa0.0.0.0][di100]]/536"></textarea>

<div class="toolbar">
  <button class="secondary" onclick="document.getElementById('fileInput').click()">Load File</button>
  <input type="file" id="fileInput" accept=".txt,.log" style="display:none" onchange="loadFile(event)">
  <button class="secondary" onclick="loadSample()">Load Sample</button>
  <button onclick="parse()">Parse</button>
  <button class="secondary" onclick="clearAll()">Clear</button>
  <div class="filter-group">
    <label>Filter:</label>
    <input type="text" id="filterText" placeholder="IP, color, headend..." oninput="applyFilter()">
    <select id="filterType" onchange="applyFilter()">
      <option value="all">All Types</option>
      <option value="node">Node</option>
      <option value="link">Link</option>
      <option value="prefix">Prefix</option>
      <option value="sr-policy">SR Policy</option>
    </select>
    <select id="filterOrigin" onchange="applyFilter()">
      <option value="all">All Origins</option>
      <option value="pcep">PCEP</option>
      <option value="bgp">BGP</option>
      <option value="config">Config</option>
    </select>
  </div>
</div>

<div id="output">
  <div class="stats" id="stats"></div>
  <div id="nodeSection"></div>
  <div id="linkSection"></div>
  <div id="prefixSection"></div>
  <div id="policySection"></div>
</div>

<div class="empty-state" id="emptyState">
  <div class="icon">📋</div>
  <p>Paste BGP-LS output above and click <strong>Parse</strong></p>
</div>

<script>
const SAMPLE = `RP/0/RP0/CPU0:srpc-lab-01#show lslib server topology-db
Mon May  4 16:26:59.068 EEST

Prefix codes: E link, V node, T IP reachable route, S SRv6 SID, SP SRTE Policy, u/U unknown
              I Identifier, N local node, R remote node, L link, P prefix, S SID, C candidate path
  [V][L2][I0x64][N[c0][b0.0.0.0][s1010.0000.0001.00]]/328
  [V][L2][I0x64][N[c0][b0.0.0.0][s1010.0000.0002.00]]/328
  [E][L2][I0x64][N[c0][b0.0.0.0][s1010.0000.0001.00]][R[c0][b0.0.0.0][s1010.0000.0002.00]][L[i172.16.3.54][n172.16.3.55]]/696
  [E][L2][I0x64][N[c0][b0.0.0.0][s1010.0000.0002.00]][R[c0][b0.0.0.0][s1010.0000.0001.00]][L[i172.16.3.55][n172.16.3.54]]/696
  [T][L2][I0x64][N[c0][b0.0.0.0][s1010.0000.0001.00]][P[p10.10.0.1/32]]/400
  [T][L2][I0x64][N[c0][b0.0.0.0][s1010.0000.0002.00]][P[p10.10.0.2/32]]/400
  [SP][SR][I0x0][N[c0][b0.0.0.0][te10.10.0.52]][C[po0x1][f0x0][e10.10.0.99][cl0x259][as0][oa10.10.0.6][di100]]/536
  [SP][SR][I0x0][N[c0][b0.0.0.0][te10.10.0.52]][C[po0x3][f0x0][e10.10.0.95][cl0x3e6][as0][oa0.0.0.0][di10]]/536`;

const PROTOCOL_ORIGINS = {
  '0x1': { name: 'PCEP', class: 'tag-pcep' },
  '0x2': { name: 'BGP', class: 'tag-bgp' },
  '0x3': { name: 'Config', class: 'tag-config' },
};

const FIELD_LABELS = {
  V: 'Node', E: 'Link', T: 'Topology', SP: 'SR Policy', SR: 'Segment Routing',
  L1: 'IS-IS Level 1', L2: 'IS-IS Level 2',
  I: 'Instance ID', c: 'ASN', b: 'BGP Router ID', s: 'System ID',
  te: 'Headend', q: 'Originator Node', p: 'Prefix',
  R: 'Remote Node', L: 'Link', i: 'Interface Address', n: 'Neighbor Address',
  po: 'Protocol Origin', f: 'Flags', e: 'Endpoint', cl: 'Color',
  as: 'AS Number', oa: 'Originator Address', di: 'Discriminator',
};

let parsedNodes = [];
let parsedLinks = [];
let parsedPrefixes = [];
let parsedPolicies = [];
let sortState = { table: null, col: null, asc: true };

function hexToDec(hex) {
  if (typeof hex !== 'string') return '';
  const s = hex.trim();
  if (s.startsWith('0x') || s.startsWith('0X')) return parseInt(s, 16);
  return '';
}

function fmtHex(val) {
  const dec = hexToDec(val);
  if (dec === '' || isNaN(dec)) return `<span class="mono">${val}</span>`;
  return `<span class="mono">${dec}</span> <span style="color:var(--muted)">(${val})</span>`;
}

function parsePathMarker(line) {
  const m = line.match(/^(\*\s*>?\s*i?|\*\s*i)/);
  if (!m) return { valid: false, best: false, ibgp: false, raw: '' };
  const raw = m[1].replace(/\s+/g, '');
  return {
    valid: raw.includes('*'),
    best: raw.includes('>'),
    ibgp: raw.includes('i'),
    raw,
  };
}

function extractBracketFields(str) {
  const fields = {};
  const re = /\[([a-zA-Z]+)([^\]]*)\]/g;
  let m;
  while ((m = re.exec(str)) !== null) {
    fields[m[1]] = m[2];
  }
  return fields;
}

// Parse a continuation line: "  66.66.66.66  100  0 i"
function parseContinuationLine(line) {
  const trimmed = line.trim();
  const m = trimmed.match(/^([\da-fA-F:\.]+)\s+(\d+)\s+(\d+)\s+([ie\?])$/);
  if (!m) return null;
  const ORIGIN_MAP = { i: 'IGP', e: 'EGP', '?': 'Incomplete' };
  return {
    nextHop: m[1],
    localPref: parseInt(m[2]),
    med: parseInt(m[3]),
    origin: ORIGIN_MAP[m[4]] || m[4],
    originRaw: m[4],
  };
}

// Detect an NLRI line — either with BGP path marker (*) or starting with bracket notation
function isNLRILine(line) {
  const trimmed = line.trim();
  // BGP path marker style: *> [SP]... or * i[T]...
  if (trimmed.match(/^\*/)) return true;
  // lslib style: starts directly with [V], [E], [T], [SP], [S]
  if (trimmed.match(/^\[(V|E|T|SP|S)\]/)) return true;
  return false;
}

// Strip header lines (hostname/prompt, date, prefix codes legend, "Retrieved N entries")
function stripHeaderLines(input) {
  const lines = input.split('\n');
  const cleaned = [];
  let inPrefixCodes = false;

  for (const line of lines) {
    const trimmed = line.trim();
    // Skip empty lines
    if (!trimmed) { inPrefixCodes = false; continue; }
    // Skip router prompt lines
    if (trimmed.match(/^RP\/\d+\/RP\d+\/CPU\d+:/)) continue;
    // Skip date lines (e.g., "Mon May  4 16:26:59.068 EEST")
    if (trimmed.match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+/)) continue;
    // Skip prefix codes block
    if (trimmed.startsWith('Prefix codes:')) { inPrefixCodes = true; continue; }
    if (inPrefixCodes && !trimmed.startsWith('[') && !trimmed.startsWith('*')) continue;
    inPrefixCodes = false;
    // Skip "Retrieved N entries" line
    if (trimmed.match(/^Retrieved \d+ entries/)) continue;
    cleaned.push(line);
  }
  return cleaned.join('\n');
}

function parseAllLines(input) {
  const cleaned = stripHeaderLines(input);
  const lines = cleaned.split('\n');
  const entries = [];
  let lastEntry = null;

  for (const line of lines) {
    if (isNLRILine(line)) {
      lastEntry = parseNLRI(line);
      if (lastEntry) entries.push(lastEntry);
    } else {
      const cont = parseContinuationLine(line);
      if (cont && lastEntry) {
        lastEntry.nextHop = cont.nextHop;
        lastEntry.localPref = cont.localPref;
        lastEntry.med = cont.med;
        lastEntry.origin = cont.origin;
        lastEntry.originRaw = cont.originRaw;
      }
    }
  }
  return entries;
}

function parseNLRI(line) {
  const trimmed = line.trim();
  const pathMarker = parsePathMarker(trimmed);

  if (trimmed.includes('[V]')) {
    return parseNodeNLRI(trimmed, pathMarker);
  } else if (trimmed.includes('[E]')) {
    return parseLinkNLRI(trimmed, pathMarker);
  } else if (trimmed.includes('[T]')) {
    return parsePrefixNLRI(trimmed, pathMarker);
  } else if (trimmed.includes('[SP]')) {
    return parseSRPolicyNLRI(trimmed, pathMarker);
  }
  return null;
}

function parseNodeNLRI(line, pathMarker) {
  const allFields = extractBracketFields(line);
  const level = line.match(/\[L(\d+)\]/)?.[1] || '';
  const sizeMatch = line.match(/\/(\d+)\s*$/);

  const nBlock = line.match(/\[N(\[[^\]]*\])+\]/)?.[0] || '';
  const nFields = extractBracketFields(nBlock);

  return {
    type: 'node',
    pathMarker,
    level: level ? `L${level}` : '',
    instanceHex: allFields.I || '',
    instanceDec: allFields.I ? hexToDec(allFields.I) : '',
    systemId: nFields.s || '',
    asn: nFields.c || '',
    bgpRouterId: nFields.b || '',
    nlriSize: sizeMatch ? sizeMatch[1] : '',
    nextHop: '', localPref: '', med: '', origin: '', originRaw: '',
    raw: line,
  };
}

function parseLinkNLRI(line, pathMarker) {
  const allFields = extractBracketFields(line);
  const level = line.match(/\[L(\d+)\]/)?.[1] || '';
  const sizeMatch = line.match(/\/(\d+)\s*$/);

  const nBlock = line.match(/\[N(\[[^\]]*\])+\]/)?.[0] || '';
  const rBlock = line.match(/\[R(\[[^\]]*\])+\]/)?.[0] || '';
  const nFields = extractBracketFields(nBlock);
  const rFields = extractBracketFields(rBlock);

  // L block: may contain [i...][n...] (interface/neighbor) or [l...][t...] (link-id/topology-id)
  const ifMatch = line.match(/\[L\[i([^\]]*)\]\[n([^\]]*)\]\]/);
  const ltMatch = line.match(/\[L\[l([^\]]*)\]\[t([^\]]*)\]\]/);
  const interfaceAddr = ifMatch ? ifMatch[1] : '';
  const neighborAddr = ifMatch ? ifMatch[2] : '';
  const linkId = ltMatch ? ltMatch[1] : '';
  const topologyId = ltMatch ? ltMatch[2] : '';

  return {
    type: 'link',
    pathMarker,
    level: level ? `L${level}` : '',
    instanceHex: allFields.I || '',
    instanceDec: allFields.I ? hexToDec(allFields.I) : '',
    localSystemId: nFields.s || '',
    localAsn: nFields.c || '',
    localBgpRouterId: nFields.b || '',
    remoteSystemId: rFields.s || '',
    remoteAsn: rFields.c || '',
    remoteBgpRouterId: rFields.b || '',
    interfaceAddr,
    neighborAddr,
    linkId,
    topologyId,
    nlriSize: sizeMatch ? sizeMatch[1] : '',
    nextHop: '', localPref: '', med: '', origin: '', originRaw: '',
    raw: line,
  };
}

function parsePrefixNLRI(line, pathMarker) {
  const allFields = extractBracketFields(line);
  const level = line.match(/\[L(\d+)\]/)?.[1] || '';
  const sizeMatch = line.match(/\/(\d+)\s*$/);

  const nBlock = line.match(/\[N(\[[^\]]*\])+\]/)?.[0] || '';
  const nFields = extractBracketFields(nBlock);

  // P block: extract prefix directly to avoid nested-bracket parsing issues
  const prefixMatch = line.match(/\[P\[p([^\]]*)\]\]/);
  const prefix = prefixMatch ? prefixMatch[1] : '';

  return {
    type: 'prefix',
    pathMarker,
    nlriType: 'Topology',
    level: level ? `L${level}` : '',
    instanceHex: allFields.I || '',
    instanceDec: allFields.I ? hexToDec(allFields.I) : '',
    systemId: nFields.s || '',
    asn: nFields.c || '',
    bgpRouterId: nFields.b || '',
    prefix,
    nlriSize: sizeMatch ? sizeMatch[1] : '',
    nextHop: '', localPref: '', med: '', origin: '', originRaw: '',
    raw: line,
  };
}

function parseSRPolicyNLRI(line, pathMarker) {
  const sizeMatch = line.match(/\/(\d+)\s*$/);

  const nBlock = line.match(/\[N(\[[^\]]*\])+\]/)?.[0] || '';
  const cBlock = line.match(/\[C(\[[^\]]*\])+\]/)?.[0] || '';
  const allFields = extractBracketFields(line);

  const nFields = extractBracketFields(nBlock);
  const cFields = extractBracketFields(cBlock);

  const flagsHex = cFields.f || '0x0';
  const flagsVal = parseInt(flagsHex, 16);
  const isIPv6Endpoint = (flagsVal & 0x80) !== 0;

  const poHex = cFields.po || '';
  const poInfo = PROTOCOL_ORIGINS[poHex] || { name: poHex, class: 'tag-unknown' };

  const colorHex = cFields.cl || '';
  const colorDec = colorHex ? hexToDec(colorHex) : '';

  const isSR = line.includes('[SR]');

  return {
    type: 'sr-policy',
    pathMarker,
    nlriSubType: isSR ? 'SR' : '',
    instanceHex: allFields.I || nFields.I || '',
    instanceDec: (allFields.I || nFields.I) ? hexToDec(allFields.I || nFields.I) : '',
    nodeAsn: nFields.c || '',
    bgpRouterId: nFields.b || '',
    headend: nFields.te || '',
    originatorNode: nFields.q || '',
    endpoint: cFields.e || '',
    colorHex,
    colorDec,
    protocolOriginHex: poHex,
    protocolOriginName: poInfo.name,
    protocolOriginClass: poInfo.class,
    flagsHex,
    flagsDec: hexToDec(flagsHex),
    isIPv6Endpoint,
    cpAsn: cFields.as || '',
    originatorAddr: cFields.oa || '',
    discriminator: cFields.di || '',
    nlriSize: sizeMatch ? sizeMatch[1] : '',
    nextHop: '', localPref: '', med: '', origin: '', originRaw: '',
    raw: line,
  };
}

function parse() {
  const input = document.getElementById('input').value.trim();
  if (!input) return;

  parsedNodes = [];
  parsedLinks = [];
  parsedPrefixes = [];
  parsedPolicies = [];

  const entries = parseAllLines(input);
  for (const entry of entries) {
    if (entry.type === 'node') parsedNodes.push(entry);
    else if (entry.type === 'link') parsedLinks.push(entry);
    else if (entry.type === 'prefix') parsedPrefixes.push(entry);
    else parsedPolicies.push(entry);
  }

  render();
}

function render() {
  const total = parsedNodes.length + parsedLinks.length + parsedPrefixes.length + parsedPolicies.length;
  if (total === 0) {
    document.getElementById('output').classList.remove('visible');
    document.getElementById('emptyState').style.display = '';
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('output').classList.add('visible');

  renderStats();
  renderNodes();
  renderLinks();
  renderPrefixes();
  renderPolicies();
  applyFilter();
}

function renderStats() {
  const origins = {};
  parsedPolicies.forEach(p => {
    origins[p.protocolOriginName] = (origins[p.protocolOriginName] || 0) + 1;
  });

  const total = parsedNodes.length + parsedLinks.length + parsedPrefixes.length + parsedPolicies.length;
  const uniqueColors = new Set(parsedPolicies.map(p => p.colorDec)).size;
  const uniqueHeadends = new Set(parsedPolicies.map(p => p.headend)).size;
  const uniqueEndpoints = new Set(parsedPolicies.map(p => p.endpoint)).size;
  const ipv4Count = parsedPolicies.filter(p => !p.isIPv6Endpoint).length;
  const ipv6Count = parsedPolicies.filter(p => p.isIPv6Endpoint).length;

  let html = `
    <div class="stat-card"><div class="label">Total Entries</div><div class="value blue">${total}</div></div>
    <div class="stat-card"><div class="label">Nodes (V)</div><div class="value">${parsedNodes.length}</div></div>
    <div class="stat-card"><div class="label">Links (E)</div><div class="value">${parsedLinks.length}</div></div>
    <div class="stat-card"><div class="label">Prefixes (T)</div><div class="value green">${parsedPrefixes.length}</div></div>
    <div class="stat-card"><div class="label">SR Policies (SP)</div><div class="value orange">${parsedPolicies.length}</div></div>
  `;
  if (parsedPolicies.length > 0) {
    html += `
      <div class="stat-card"><div class="label">Unique Colors</div><div class="value purple">${uniqueColors}</div></div>
      <div class="stat-card"><div class="label">Unique Headends</div><div class="value blue">${uniqueHeadends}</div></div>
      <div class="stat-card"><div class="label">Unique Endpoints</div><div class="value green">${uniqueEndpoints}</div></div>
      <div class="stat-card"><div class="label">IPv4 Endpoint</div><div class="value">${ipv4Count}</div></div>
      <div class="stat-card"><div class="label">IPv6 Endpoint</div><div class="value">${ipv6Count}</div></div>
    `;
    for (const [name, count] of Object.entries(origins)) {
      html += `<div class="stat-card"><div class="label">${name} Origin</div><div class="value">${count}</div></div>`;
    }
  }
  document.getElementById('stats').innerHTML = html;
}

function pathMarkerTags(pm) {
  if (!pm.raw) return '<span style="color:var(--muted)">—</span>';
  let tags = `<span class="mono" style="color:var(--muted);margin-right:6px">${pm.raw}</span>`;
  if (pm.best) tags += '<span class="tag tag-best">best</span> ';
  else if (pm.valid) tags += '<span class="tag tag-valid">valid</span> ';
  if (pm.ibgp) tags += '<span class="tag tag-ibgp">iBGP</span>';
  else if (pm.valid) tags += '<span class="tag tag-best">local</span>';
  return tags;
}

function applyFilter() {
  const text = document.getElementById('filterText').value.toLowerCase();
  const type = document.getElementById('filterType').value;
  const origin = document.getElementById('filterOrigin').value;

  document.querySelectorAll('#output tr[data-type]').forEach(row => {
    const rowType = row.dataset.type;
    const rowOrigin = row.dataset.origin || '';
    const searchable = row.dataset.searchable || '';

    let show = true;
    if (type !== 'all' && rowType !== type) show = false;
    if (origin !== 'all' && rowOrigin !== origin) show = false;
    if (text && !searchable.includes(text)) show = false;

    row.style.display = show ? '' : 'none';
  });

  ['nodeSection', 'linkSection', 'prefixSection', 'policySection'].forEach(id => {
    const section = document.getElementById(id);
    if (!section.innerHTML) return;
    const visibleRows = section.querySelectorAll('tr[data-type]:not([style*="display: none"])');
    const table = section.querySelector('.table-wrap');
    if (table) table.style.display = visibleRows.length ? '' : 'none';
  });
}

function sortTable(tableType, col) {
  const tableMap = { node: parsedNodes, link: parsedLinks, prefix: parsedPrefixes, policy: parsedPolicies };
  const arr = tableMap[tableType];
  if (!arr) return;

  if (sortState.table === tableType && sortState.col === col) {
    sortState.asc = !sortState.asc;
  } else {
    sortState = { table: tableType, col, asc: true };
  }

  arr.sort((a, b) => {
    let va, vb;
    if (col === 'idx') return 0;
    else if (col === 'path') { va = a.pathMarker.raw; vb = b.pathMarker.raw; }
    else if (col === 'protocolOriginName') { va = a.protocolOriginName; vb = b.protocolOriginName; }
    else { va = a[col]; vb = b[col]; }

    const na = Number(va), nb = Number(vb);
    if (!isNaN(na) && !isNaN(nb)) return sortState.asc ? na - nb : nb - na;

    va = String(va || '');
    vb = String(vb || '');
    return sortState.asc ? va.localeCompare(vb) : vb.localeCompare(va);
  });

  const renderMap = { node: renderNodes, link: renderLinks, prefix: renderPrefixes, policy: renderPolicies };
  renderMap[tableType]();
  applyFilter();
}

function loadSample() {
  document.getElementById('input').value = SAMPLE;
  parse();
}

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('input').value = e.target.result;
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAll() {
  document.getElementById('input').value = '';
  parsedNodes = [];
  parsedLinks = [];
  parsedPrefixes = [];
  parsedPolicies = [];
  document.getElementById('output').classList.remove('visible');
  document.getElementById('stats').innerHTML = '';
  document.getElementById('nodeSection').innerHTML = '';
  document.getElementById('linkSection').innerHTML = '';
  document.getElementById('prefixSection').innerHTML = '';
  document.getElementById('policySection').innerHTML = '';
  document.getElementById('emptyState').style.display = '';
  document.getElementById('filterText').value = '';
  document.getElementById('filterType').value = 'all';
  document.getElementById('filterOrigin').value = 'all';
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) parse();
});
